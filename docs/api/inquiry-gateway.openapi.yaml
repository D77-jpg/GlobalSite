components:
  schemas:
    InquiryInput:
      type: object
      additionalProperties: false
      properties:
        submissionId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        company:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 200
        country:
          type: string
          maxLength: 80
        phone:
          type: string
          maxLength: 80
        productIds:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{24}$
          maxItems: 50
        quantity:
          type:
            - number
            - 'null'
          minimum: 1
          maximum: 1000000000
        message:
          type: string
          minLength: 1
          maxLength: 8000
        website:
          type: string
          maxLength: 200
        privacyConsent:
          const: true
        privacyVersion:
          type: string
          maxLength: 80
        pageUrl:
          type: string
          maxLength: 2000
        referrer:
          type:
            - string
            - 'null'
        utm:
          type: object
          additionalProperties: false
          properties:
            source:
              type:
                - string
                - 'null'
            medium:
              type:
                - string
                - 'null'
            campaign:
              type:
                - string
                - 'null'
            term:
              type:
                - string
                - 'null'
            content:
              type:
                - string
                - 'null'
          required:
            - source
            - medium
            - campaign
            - term
            - content
        firstVisitAt:
          type: string
          format: date-time
        turnstileToken:
          type: string
          maxLength: 2048
      required:
        - submissionId
        - name
        - company
        - email
        - country
        - phone
        - productIds
        - quantity
        - message
        - website
        - privacyConsent
        - privacyVersion
        - pageUrl
        - referrer
        - utm
        - firstVisitAt
        - turnstileToken

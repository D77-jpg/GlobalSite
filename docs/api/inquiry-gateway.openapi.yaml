openapi: 3.1.0
info:
  title: GlobalSite inquiry gateway
  version: 1.0.0
  description: >-
    Independent public intake. Exact published/preview origins only; no cookies/CRM. Validate before
    archiving, archive and durable Worker tasks before success. Honeypot submissions are archived
    and flagged. Same submissionId+payload is idempotent; different payload 409. New IDs from same
    email within10min are retained and grouped asynchronously. JSON <=24KiB; multipart payload field
    <=24KiB, max3 JPEG/PNG/WebP/PDF attachments each2MiB. IP/site limits return429 with Retry-After.
    CORS is not visitor authentication; optional Turnstile verified server-side.
    Origin may be omitted only for a same-origin login preview carrying a valid X-Preview-Token;
    it then resolves to the configured management origin. Published requests require Origin.
servers:
  - url: /api/inquiry-gateway/v1
paths:
  /sites/{publicId}/config:
    get:
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
        - name: Origin
          in: header
          required: false
          schema:
            type: string
            format: uri
        - name: X-Preview-Token
          in: header
          required: false
          schema:
            type: string
          description: Only login preview uses this short-lived signed grant; never put it in URLs.
      responses:
        '200':
          description: Runtime form configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      enabled:
                        type: boolean
                      turnstileSiteKey:
                        type:
                          - string
                          - 'null'
                      privacyVersion:
                        type: string
                      maxFiles:
                        const: 3
                      maxFileBytes:
                        const: 2097152
                    required:
                      - enabled
                      - turnstileSiteKey
                      - privacyVersion
                      - maxFiles
                      - maxFileBytes
                required:
                  - success
                  - data
        '400':
          description: Rejected before archive or server error; no visitor details returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: false
                  error:
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                    required:
                      - code
                required:
                  - success
                  - error
        '403':
          description: Rejected before archive or server error; no visitor details returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: false
                  error:
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                    required:
                      - code
                required:
                  - success
                  - error
        '404':
          description: Rejected before archive or server error; no visitor details returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: false
                  error:
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                    required:
                      - code
                required:
                  - success
                  - error
        '409':
          description: Rejected before archive or server error; no visitor details returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: false
                  error:
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                    required:

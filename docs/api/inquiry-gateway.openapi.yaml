  /sites/{publicId}/inquiries:
    post:
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
        - name: Origin
          in: header
          required: false
          schema:
            type: string
            format: uri
        - name: X-Preview-Token
          in: header
          required: false
          schema:
            type: string
          description: Only login preview uses this short-lived signed grant; never put it in URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryInput'
          multipart/form-data:
            schema:
              type: object
              required:
                - payload
              additionalProperties: false
              properties:
                payload:
                  type: string
                  description: JSON-encoded InquiryInput
                attachments:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: >-
            Encrypted inquiry and durable processing task committed; classification/email are
            asynchronous.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      received:
                        const: true
                      receiptId:
                        type: string
                        format: uuid
                    required:
                      - received
                      - receiptId
                required:
                  - success
                  - data
        '400':
          description: Rejected before archive or server error; no visitor details returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: false
                  error:
                    type: object

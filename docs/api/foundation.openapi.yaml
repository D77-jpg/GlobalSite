components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gs_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: gs_refresh
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must match PUBLIC_URL origin exactly.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 80
            requestId:
              type: string
              format: uuid
          required:
            - code
            - requestId
      required:
        - success
        - error
    Accepted:
      type: object
      properties:
        accepted:
          type: boolean
          enum:
            - true
        devReceipt:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - accepted
    User:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          minLength: 1
          maxLength: 200
          format: email
        emailVerified:
          type: boolean
        twoFactorEnabled:
          type: boolean
        locale:
          type: string
          enum:
            - zh
            - en
      required:
        - id
        - name
        - email
        - emailVerified
        - twoFactorEnabled
        - locale
    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        organizationId:
          type: string
          pattern: ^[a-f0-9]{24}$
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
      required:
        - user
        - organizationId
        - role
    Organization:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          type: string
          minLength: 1
          maxLength: 160
        plan:
          type: string
          enum:
            - trial
            - starter
            - growth
      required:
        - id
        - name
        - plan
    Member:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        userId:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          minLength: 1
          maxLength: 200
          format: email
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
        status:
          type: string
          enum:
            - invited
            - active
            - revoked
      required:
        - id
        - role
        - status
    Session:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        current:
          type: boolean
        userAgent:
          type: string
          minLength: 0
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - current
        - userAgent
        - createdAt
        - expiresAt
    Challenge:
      type: object
      properties:
        challengeId:
          type: string
          pattern: ^[a-f0-9]{24}$
        devReceipt:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - challengeId
    Limits:
      type: object
      properties:
        members:
          type: integer
          minimum: 1
        sites:
          type: integer
          minimum: 1
        ai_tokens:
          type: integer
          minimum: 1
        builds:
          type: integer
          minimum: 1
        storage_bytes:
          type: integer
          minimum: 1
      required:
        - members
        - sites
        - ai_tokens
        - builds
        - storage_bytes
    Usage:
      type: object
      properties:
        period:
          type: string
          minLength: 1
          maxLength: 7
        limits:
          $ref: "#/components/schemas/Limits"
        items:
          type: array
          items:
            type: object
            properties:
              metric:
                type: string
                enum:
                  - ai_tokens
                  - builds
                  - storage_bytes
              consumed:
                type: integer
                minimum: 0
              reserved:
                type: integer
                minimum: 0
            required:
              - metric
              - consumed
              - reserved
      required:
        - period
        - limits
        - items
    Provider:
      type: object
      properties:
        modelName:
          type: string
          minLength: 0
          maxLength: 120
        baseUrl:
          type: string
          enum:
            - https://api.openai.com/v1
        enabled:
          type: boolean
        configured:
          type: boolean
      required:
        - modelName
        - baseUrl
        - enabled
        - configured
    Asset:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        mime:
          type: string
          enum:
            - image/jpeg
            - image/png
      required:
        - id
        - bytes
        - mime
    Audit:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        action:
          type: string
          minLength: 1
          maxLength: 120
        actorId:
          type: string
          pattern: ^[a-f0-9]{24}$
        targetId:
          type: string
          minLength: 1
          maxLength: 128
        requestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - createdAt
    MemberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        nextCursor:
          type: string
          pattern: ^[a-f0-9]{24}$
          nullable: true
        hasMore:
          type: boolean
      required:
        - items
        - nextCursor
        - hasMore
    SessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        nextCursor:
          type: string
          pattern: ^[a-f0-9]{24}$
          nullable: true
        hasMore:
          type: boolean
      required:
        - items
        - nextCursor
        - hasMore
    OrganizationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        nextCursor:
          type: string
          pattern: ^[a-f0-9]{24}$
          nullable: true
        hasMore:
          type: boolean
      required:
        - items
        - nextCursor
        - hasMore
    AuditPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Audit"
        nextCursor:
          type: string
          pattern: ^[a-f0-9]{24}$
          nullable: true
        hasMore:
          type: boolean
      required:
        - items
        - nextCursor
        - hasMore
    Registration:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
        organizationName:
          type: string
          minLength: 1
          maxLength: 160
        locale:
          type: string
          enum:
            - zh
            - en
          default: zh
      required:
        - email
        - password
        - name
        - organizationName
      additionalProperties: false
    Login:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
          format: email
        password:
          type: string
          minLength: 0
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
          format: email
      required:
        - email
      additionalProperties: false
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
        - token
      additionalProperties: false
    PasswordReset:
      type: object
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - token
        - password
      additionalProperties: false
    OtpRequest:
      type: object
      properties:
        challengeId:
          type: string
          pattern: ^[a-f0-9]{24}$
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - challengeId
        - code
      additionalProperties: false
    PasswordRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - password
      additionalProperties: false
    TwoFactorUpdate:
      type: object
      properties:
        challengeId:
          type: string
          pattern: ^[a-f0-9]{24}$
        code:
          type: string
          pattern: ^[0-9]{6}$
        enabled:
          type: boolean
      required:
        - challengeId
        - code
        - enabled
      additionalProperties: false
    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
      required:
        - name
      additionalProperties: false
    Invitation:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
          format: email
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
      required:
        - email
        - role
      additionalProperties: false
    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
        status:
          type: string
          enum:
            - active
            - revoked
      required: []
      additionalProperties: false
    ProviderUpdate:
      type: object
      properties:
        modelName:
          type: string
          minLength: 1
          maxLength: 120
        baseUrl:
          type: string
          enum:
            - https://api.openai.com/v1
        enabled:
          type: boolean
        apiKey:
          type: string
          minLength: 1
          maxLength: 512
      required:
        - modelName
        - baseUrl
        - enabled
      additionalProperties: false

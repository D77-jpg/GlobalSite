components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gs_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: gs_refresh
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must match PUBLIC_URL origin exactly.
  schemas:
    CrmConnection:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        baseUrl:
          type: string
          format: uri
        projectId:
          type: string
          pattern: ^[a-f0-9]{24}$
        projectName:
          anyOf:
            - type: string
            - type: 'null'
        revision:
          type: integer
        generation:
          type: integer
        status:
          type: string
          enum:
            - checking
            - connected
            - degraded
            - auth_failed
            - contract_error
            - disconnecting
            - disconnected
        active:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        lastCheckedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastErrorCode:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - baseUrl
        - projectId
        - projectName
        - revision
        - generation
        - status
        - active
        - scopes
        - lastCheckedAt
        - lastErrorCode
        - createdAt
    CrmSync:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        resource:
          type: string
          enum:
            - products
            - company
            - playbook
            - knowledge
            - outcomes
        status:
          type: string
        cursor:
          anyOf:
            - type: string
            - type: 'null'
        updatedSince:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastErrorCode:
          anyOf:
            - type: string
            - type: 'null'
        nextDue:
          type: string
          format: date-time
        imported:
          type: integer
        full:
          type: boolean
      required:
        - id
        - resource
        - status
        - cursor
        - updatedSince
        - lastSuccessAt
        - lastErrorCode
        - nextDue
        - imported
        - full
    CrmDelivery:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        inquiryId:
          type: string
          pattern: ^[a-f0-9]{24}$
        connectionId:
          type: string
          pattern: ^[a-f0-9]{24}$
        status:
          type: string
          enum:
            - pending
            - sending
            - sent
            - retry
            - paused
            - failed
        attempts:
          type: integer
        nextAttemptAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastErrorCode:
          anyOf:
            - type: string
            - type: 'null'
        remoteId:
          anyOf:
            - type: string
            - type: 'null'
        customerId:
          anyOf:
            - type: string
            - type: 'null'
        customerUrl:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
        - inquiryId
        - connectionId
        - status
        - attempts
        - nextAttemptAt
        - lastErrorCode
        - remoteId
        - customerId
        - customerUrl
    CrmState:
      type: object
      additionalProperties: false
      properties:
        connection:
          anyOf:
            - $ref: '#/components/schemas/CrmConnection'
            - type: 'null'
        syncStates:
          type: array
          items:
            $ref: '#/components/schemas/CrmSync'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/CrmDelivery'
      required:
        - connection
        - syncStates
        - deliveries
    CrmSave:
      type: object
      additionalProperties: false
      properties:
        baseUrl:
          type: string
          format: uri
          maxLength: 500
        projectId:
          type: string
          pattern: ^[a-f0-9]{24}$
        credential:
          type: string
          minLength: 20
          maxLength: 512
        revision:
          type: integer
          minimum: 0
      required:
        - baseUrl
        - projectId
        - credential
        - revision
    CrmEmpty:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    CrmSyncRequest:
      type: object
      additionalProperties: false
      properties:
        full:
          type: boolean
      required:
        - full
    CrmDisconnect:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
      required:
        - revision
    CrmInquiryLink:
      type: object
      additionalProperties: false
      properties:
        connectionId:
          type: string
          pattern: ^[a-f0-9]{24}$
        status:
          type: string
        lastErrorCode:
          anyOf:
            - type: string
            - type: 'null'
        customerId:
          anyOf:
            - type: string
            - type: 'null'
        inquiryId:
          anyOf:
            - type: string
            - type: 'null'
        customerUrl:
          anyOf:
            - type: string
            - type: 'null'
        outcome:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                eventId:
                  type: string
                toStatus:
                  type: string
                  enum:
                    - won
                    - lost
                occurredAt:
                  type: string
                  format: date-time
              required:
                - eventId
                - toStatus
                - occurredAt
            - type: 'null'
      required:
        - connectionId
        - status
        - lastErrorCode
        - customerId
        - inquiryId
        - customerUrl
        - outcome
    CrmCandidate:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        revision:
          type: integer
        localName:
          type: string
        remoteName:
          anyOf:
            - type: string
            - type: 'null'
        candidateHash:
          anyOf:
            - type: string
            - type: 'null'
        sourceStatus:
          type: string
        data:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
      required:
        - id
        - revision
        - localName
        - remoteName
        - candidateHash
        - sourceStatus
        - data
    CrmReview:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        candidateHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        decision:
          type: string
          enum:
            - accept
            - reject
      required:
        - revision
        - candidateHash
        - decision
    CrmResource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        kind:
          type: string
        remoteId:
          type: string
        payload:
          type: object
          additionalProperties: true
        sha256:
          type: string
        withdrawn:
          type: boolean
        capturedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - remoteId
        - payload
        - sha256
        - withdrawn
        - capturedAt
    InquirySettings:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
        publicId:
          type: string
        enabled:
          type: boolean
        privacyReviewed:
          type: boolean
        aiSpamEnabled:
          type: boolean
        notificationUserIds:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{24}$
        turnstileSiteKey:
          type:
            - string
            - 'null'
        turnstileConfigured:
          type: boolean
        gatewayUrl:
          type: string
      required:
        - revision
        - publicId
        - enabled
        - privacyReviewed
        - aiSpamEnabled
        - notificationUserIds
        - turnstileSiteKey
        - turnstileConfigured
        - gatewayUrl
    InquirySettingsInput:
      type: object
      additionalProperties: false
      required:
        - revision
        - enabled
        - privacyReviewed
        - aiSpamEnabled
        - notificationUserIds
        - turnstileSiteKey
      properties:
        revision:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        privacyReviewed:
          type: boolean
        aiSpamEnabled:
          type: boolean
        notificationUserIds:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{24}$
          maxItems: 20
        turnstileSiteKey:
          type:
            - string
            - 'null'
        turnstileSecret:
          type:
            - string
            - 'null'
    InquirySource:
      type: object
      additionalProperties: false
      properties:
        pageUrl:
          type: string
        referrer:
          type:
            - string
            - 'null'
        utm:
          type: object
          additionalProperties: false
          properties:
            source:
              type:
                - string
                - 'null'
            medium:
              type:
                - string
                - 'null'
            campaign:
              type:
                - string
                - 'null'
            term:
              type:
                - string
                - 'null'
            content:
              type:
                - string
                - 'null'
          required:
            - source
            - medium
            - campaign
            - term
            - content
        country:
          type:
            - string
            - 'null'

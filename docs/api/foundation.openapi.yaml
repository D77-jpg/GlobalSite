openapi: 3.0.3
info:
  title: GlobalSite Foundation API
  version: 0.1.0
  description: >-
    S2 independent account and organization API. This is not the GlobalCRM Integration API. Cookie sessions
    use 15-minute access and 14-day refresh lifetime; writes require exact PUBLIC_URL Origin and session-bound
    double-submit CSRF. Login locks after five failures for 15 minutes. OTP expires in five minutes with five
    attempts. Auth requests are limited to 40/IP/minute, other requests 240/IP/minute, shared via MongoDB.
    Development email receipts never appear in production. Collection pages sort by descending ObjectId; null
    cursor ends a page series.
servers:
  - url: http://localhost:5080/api/v1
    description: Compose
  - url: http://localhost:5001/api/v1
    description: Local API
paths:
  /health/live:
    get:
      operationId: foundation1
      summary: Process liveness
      x-roles: []
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                required:
                  - success
                  - data
        "400":
          description: Validation, expired/used token or OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials or session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Origin, CSRF, role or membership rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found within current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict or plan quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Shared request rate limit
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

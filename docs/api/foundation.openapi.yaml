            - "null"
        provenance:
          type:
            - object
            - "null"
        status:
          enum:
            - draft
            - active
            - archived
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CatalogProductResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          const: true
        data:
          $ref: "#/components/schemas/CatalogProduct"
    CatalogProductListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          const: true
        data:
          type: object
          required:
            - items
            - nextCursor
            - hasMore
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CatalogProduct"
            nextCursor:
              type:
                - string
                - "null"
            hasMore:
              type: boolean
    CatalogSource:
      type: object
      required:
        - kind
        - quote
      properties:
        kind:
          enum:
            - manual
            - asset
            - product
            - website
            - globalcrm
        refId:
          type: string
          pattern: ^[a-f0-9]{24}$
        quote:
          type: string
        url:
          type: string
          format: uri
        sha256:
          type: string
        revision:
          type: integer
        capturedAt:
          type: string
          format: date-time
        label:
          type: string
        textVerified:
          type: boolean
    CatalogFact:
      type: object
      required:
        - id
        - subjectType
        - subjectId
        - type
        - value
        - unit
        - source
        - status
        - revision
        - reviewedBy
        - reviewedAt
        - reason
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        subjectType:

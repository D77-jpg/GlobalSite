x-s3-catalog:
  status: implemented
  crmContract: >-
    GlobalCRM docs/integration/integration-v1.openapi.yaml C1 @60cdbc48035301c152a58b924558b08a850fa36a;
    read-only mapping, no CRM calls in S3
  notes:
    - >-
      All routes use the current cookie organization; 24-hex tenant-owned IDs only. Editors write; only
      administrators confirm/reject facts.
    - Mutating JSON input is strict; revisions enforce compare-and-swap. Files remain private and no-store.
    - Products are drafts until edited. AI and website facts are always candidates.
    - All asynchronous writes fence their task lease and recheck the initiator membership.
x-s4-agents:
  status: implemented
  notes:
    - >-
      Site creation and private review only. Publication check enforces approval plus current confirmed facts;
      deployment is S5.
    - >-
      Research is AI keyword suggestions, not live search data. Outputs are human editable and must be
      explicitly confirmed.
    - >-
      Each run freezes input, persists unit outputs before billing settlement, fences writes, and supports
      retry/cancel. Quota pauses instead of discarding work.
    - >-
      Product pages require specs/material/application/certifications/oem/moq/samples/packaging blocks; FAQ
      answers begin with a 40–60 word lead.
    - >-
      All hard claims require valid same-tenant confirmed fact references. Editing, new plans or withdrawn
      facts invalidate approval.

x-s8-s11-b2b:
  status: implemented
  notes:
    - Interview asks at most ten missing company/business-contact or selected product procurement facts per round; all answers remain candidates.
    - Buyer profiles and page briefs are private instructions, never evidence for public business claims.
    - Reference sites are bounded robots-aware SSRF-protected reads; their content is not company evidence.
    - Optional structured blocks preserve old pages. All public item text, assets and links are validated against the confirmed sitemap.
    - Public email addresses must match explicitly referenced confirmed company contact facts.
    - Hard numerical claims require evidence; narrowly bounded workflow wording such as in one place is not a business quantity.
    - Reviews freeze page revisions and private screenshot artifacts. Refine requires an unchanged review and writes new drafts, never approvals.
    - B2B commercial publication requires confirmed procurement data; draft review remains available with gaps.

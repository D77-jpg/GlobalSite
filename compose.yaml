name: globalsite
x-app: &app
  build: .
  image: globalsite:local
  environment: &environment
    NODE_ENV: ${NODE_ENV:-development}
    PORT: 5001
    AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-}
    MONGODB_URI: mongodb://mongo:27017/globalsite?replicaSet=rs0
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5080}
    STORAGE_ROOT: /app/storage
    CRM_ALLOWED_ORIGINS: ${CRM_ALLOWED_ORIGINS:-}
    CRM_ALLOW_LOCAL: ${CRM_ALLOW_LOCAL:-false}
    INQUIRY_TRUSTED_PROXY: ${INQUIRY_TRUSTED_PROXY:-}
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-GlobalSite <noreply@example.invalid>}
  volumes:
    - storage:/app/storage
  depends_on:
    mongo:
      condition: service_healthy
  restart: unless-stopped
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongo:27017''}]}).ok }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-5080}:5001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["node", "server/dist/worker.js"]
volumes:
  mongo:
  storage:

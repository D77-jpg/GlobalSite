name: globalsite
x-app: &app
  build: .
  image: globalsite:local
  environment: &environment
    NODE_ENV: ${NODE_ENV:-development}
    PORT: 5001
    AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-}
    AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
    MONGODB_URI: mongodb://mongo:27017/globalsite?replicaSet=rs0
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5080}
    STORAGE_ROOT: /app/storage
    CRM_ALLOWED_ORIGINS: ${CRM_ALLOWED_ORIGINS:-}
    CRM_ALLOW_LOCAL: ${CRM_ALLOW_LOCAL:-false}
    INQUIRY_TRUSTED_PROXY: ${INQUIRY_TRUSTED_PROXY:-}
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-GlobalSite <noreply@example.invalid>}
    AUTO_IMAGE_HOME_MAX: ${AUTO_IMAGE_HOME_MAX:-6}
    AUTO_IMAGE_DETAIL_MAX: ${AUTO_IMAGE_DETAIL_MAX:-3}
    AUTO_IMAGE_CONCURRENCY: ${AUTO_IMAGE_CONCURRENCY:-2}
    QUALITY_BASELINE_THRESHOLD: ${QUALITY_BASELINE_THRESHOLD:-3.5}
    REVIEW_SAMPLE_THRESHOLD: ${REVIEW_SAMPLE_THRESHOLD:-4}
    AI_FULL_PAGE_TIMEOUT_MS: ${AI_FULL_PAGE_TIMEOUT_MS:-240000}
    AI_STREAM_LONG_TASKS: ${AI_STREAM_LONG_TASKS:-true}
    AI_UNKNOWN_ABSORB_LIMIT: ${AI_UNKNOWN_ABSORB_LIMIT:-5}
    # S36 platform AI service. Values come from the shell/.env or a secret manager;
    # blank keeps organization AI settings (non-production) and never ships a key.
    PLATFORM_AI_BASE_URL: ${PLATFORM_AI_BASE_URL:-}
    PLATFORM_AI_API_KEY: ${PLATFORM_AI_API_KEY:-}
    PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-}
    PLATFORM_AI_VISION_MODEL: ${PLATFORM_AI_VISION_MODEL:-}
    PLATFORM_AI_OUTPUT_MODE: ${PLATFORM_AI_OUTPUT_MODE:-}
    PLATFORM_IMAGE_BASE_URL: ${PLATFORM_IMAGE_BASE_URL:-}
    PLATFORM_IMAGE_API_KEY: ${PLATFORM_IMAGE_API_KEY:-}
    PLATFORM_IMAGE_MODEL: ${PLATFORM_IMAGE_MODEL:-}
    PLATFORM_IMAGE_MODE: ${PLATFORM_IMAGE_MODE:-auto}
    ALLOW_ORG_AI_KEYS: ${ALLOW_ORG_AI_KEYS:-false}
    PLATFORM_UPGRADE_URL: ${PLATFORM_UPGRADE_URL:-}
    PLATFORM_AI_PRICE_PER_MILLION: ${PLATFORM_AI_PRICE_PER_MILLION:-}
    PLATFORM_IMAGE_PRICE: ${PLATFORM_IMAGE_PRICE:-}
    PLATFORM_COST_ALERT: ${PLATFORM_COST_ALERT:-}
  volumes:
    - storage:/app/storage
  depends_on:
    mongo:
      condition: service_healthy
  restart: unless-stopped
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongo:27017''}]}).ok }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-5080}:5001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["node", "server/dist/worker.js"]
volumes:
  mongo:
  storage:
